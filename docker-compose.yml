services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: floodlens-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=FloodLens Production API
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1
      - MODEL_CONFIG_PATH=/app/ml-model/config.yaml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: floodlens-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
